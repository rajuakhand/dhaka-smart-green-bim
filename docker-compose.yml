version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dhaka-smart-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhaka}
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_smart}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhaka"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dhaka-smart-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://dhaka:dhaka@postgres:5432/dhaka_smart}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    container_name: dhaka-smart-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: npm run dev -- -H 0.0.0.0

volumes:
  pg_data:
